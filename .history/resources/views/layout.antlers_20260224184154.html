<!doctype html>
<html lang="{{ site:short_locale }}">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ title ?? site:name }}</title>
        {{ vite src="resources/js/site.js|resources/css/site.css" }}
    </head>
    <body class="bg-zinc-100 dark:bg-zinc-900 font-sans leading-normal text-zinc-800 dark:text-zinc-400">
        <header class="bg-white shadow-sm sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      
      <div class="flex-shrink-0 flex items-center">
        <span class="text-2xl font-bold text-blue-600 tracking-tight cursor-pointer">
          NomeSito
        </span>
      </div>

      <nav class="hidden md:flex space-x-8">
        <a href="#" class="text-gray-600 hover:text-blue-600 font-medium transition-colors">Home</a>
        <a href="#" class="text-gray-600 hover:text-blue-600 font-medium transition-colors">Servizi</a>
        <a href="#" class="text-gray-600 hover:text-blue-600 font-medium transition-colors">Progetti</a>
        <a href="#" class="text-gray-600 hover:text-blue-600 font-medium transition-colors">Contatti</a>
      </nav>

      <div class="hidden md:block">
        <button class="bg-blue-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-700 transition">
          Inizia ora
        </button>
      </div>

      <div class="md:hidden flex items-center">
        <button class="text-gray-600 hover:text-blue-600 focus:outline-none">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
          </svg>
        </button>
      </div>

    </div>
  </div>
</header>
        <div class="mx-auto px-2 lg:min-h-screen flex flex-col items-center justify-center">
            {{ template_content }}
        </div>
    </body>
</html>
